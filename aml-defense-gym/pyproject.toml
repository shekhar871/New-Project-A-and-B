[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-defense-gym"
version = "0.2.0"
description = "OpenEnv-style AML compliance gym: sanctions, EDD, streaming transaction monitoring."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pandas>=2.0.0",
    "openai>=1.40.0",
    "openenv-core>=0.2.0",
]

[project.scripts]
server = "server.app:main"

[project.optional-dependencies]
dev = ["httpx>=0.25.0", "pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aml_defense_gym*"]

[tool.setuptools.package-data]
aml_defense_gym = ["data/*.csv"]
